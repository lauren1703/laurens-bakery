(()=>{const root=document.getElementById('preferred-bakery'),room=root.querySelector('#pb-room'),content=root.querySelector('#pb-content'),status=root.querySelector('#pb-status'),mobile=root.querySelector('#pb-mobile');let scene='outside',role='rippling',project=0,modal=null;const titles=['Deep learning','This portfolio','Project to add','Project to add'];const h=(go,label,l,t,w,ht)=>`<button class="hot cursor-interaction" data-go="${go}" aria-label="${label}" style="left:${l}%;top:${t}%;width:${w}%;height:${ht}%"><span>${label}</span></button>`;const names={outside:'Storefront',inside:'Inside the bakery',experience:'Behind the counter',project:'The recipe notebook'};
function render(){room.dataset.scene=scene;room.setAttribute('aria-label',names[scene]);content.innerHTML='';root.querySelectorAll('nav button').forEach(b=>{if((b.dataset.go==='inside'&&(scene==='inside'||scene==='project'))||b.dataset.go===scene)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(scene==='outside'){content.innerHTML=h('inside','Enter the bakery',39,24,22,49)+h('inside','Enter bakery',27.8,86,22,10)+h('inside','View projects',51.5,86,21,10);status.textContent='Open the door or choose “Enter bakery.”';mobile.innerHTML='<button class="cursor-interaction" data-go="inside">Enter bakery →</button>'}
if(scene==='inside'){content.innerHTML=h('about','Meet the baker',17,14,23,44)+h('experience','Experience wall',63,20,35,37)+[11,27,43,59].map((l,i)=>h('project:'+i,['Deep learning','Portfolio','Project recipe','Project recipe'][i],l,59,15,25)).join('')+h('contact','Let’s connect',83,67,16,31);status.textContent='Choose a pastry, a picture frame, or meet the baker.';mobile.innerHTML='<button class="cursor-interaction" data-go="project:0">Pastries · Projects</button><button class="cursor-interaction" data-go="experience">Frames · Experience</button><button class="cursor-interaction" data-go="about">Meet the baker</button>'}
if(scene==='experience'){const upcoming=role==='rippling';content.innerHTML=h('role:rippling','Rippling',7,5,28,25)+h('role:earlier','Earlier roles',12,33,32,30)+h('role:campus','Campus',14,63,31,31)+`<section class="live role" aria-live="polite"><h2>${upcoming?'Rippling':role==='campus'?'Campus experience':'Earlier experience'}</h2><p class="subtle">${upcoming?'Upcoming role · per your pitch':'Organization · Title · Dates to add'}</p><h3>${upcoming?'The next chapter':'My contribution'}</h3><p>${upcoming?'Building meaningful things, taking ownership, and learning alongside my teammates.':'Your responsibilities and the work you personally owned within the team.'}</p><h3>${upcoming?'What I hope to learn':'What I learned'}</h3><p>${upcoming?'Growing through collaboration, shared knowledge, and constructive feedback.':'The challenges, technical decisions, and lessons you applied.'}</p><p class="subtle">${upcoming?'Title and start date to confirm.':'Design placeholder — experience details to add.'}</p></section>`;status.textContent='Select a frame to explore an experience.';mobile.innerHTML=['rippling','earlier','campus'].map(v=>`<button class="cursor-interaction" data-go="role:${v}">${v==='rippling'?'Rippling':v==='earlier'?'Earlier roles':'Campus'}</button>`).join('')}
if(scene==='project'){content.innerHTML=`<div class="live project-title">${titles[project]}</div><div class="live demo"><strong>${project===0?'Input → Model → Output':'Your project in action'}</strong><small>Screenshot / demonstration to add</small></div><section class="live recipe"><h3>The problem</h3><p>${project===1?'Make professional work clear and enjoyable to explore.':'The question this project set out to answer.'}</p><h3>My role</h3><p>Your specific contributions and collaborators.</p><h3>Approach</h3><p>Technical decisions, experiments, and tradeoffs.</p><h3>Results</h3><p>Outcomes, limitations, and lessons learned.</p></section>`+h('code','GitHub link — to add',17,76,20,12)+h('demo','Live demo — to add',38,76,21,12);status.textContent='Recipe layout · project facts and links are provisional.';mobile.innerHTML='<button class="cursor-interaction" data-go="inside">← Back to the pastry counter</button>'}
if(modal)drawModal();}
function drawModal(){const copy={about:`<span class="subtle">Meet the baker</span><h1>Hi, I’m Lauren.</h1><p>An engineer with a creative streak, a curious mind, and an interest in building meaningful things with other people.</p><h2>Why a bakery?</h2><p>A welcoming place to share my work, document my growth, and make new connections.</p><p class="subtle">Draft based on your pitch. Background and personal interests to add.</p><button class="cursor-interaction" data-go="contact">Let’s connect →</button>`,contact:`<span class="subtle">A note from the café table</span><h1>Let’s make something good.</h1><p>Have a question, an idea, or a project in mind? There’s always room at the table.</p><div class="destinations">${['Email','LinkedIn','GitHub'].map(v=>`<button class="cursor-interaction" data-note="${v} link to add before launch.">${v} ↗</button>`).join('')}</div><p class="subtle" style="margin-top:20px">Contact destinations are placeholders.</p>`,resume:`<span class="subtle">Something to take with you</span><h1>Lauren’s résumé</h1><p>The finished website will open your résumé PDF in a new tab, with a download option.</p><p class="subtle">Your résumé file has not been supplied yet.</p><button class="cursor-interaction" data-go="experience">Explore experience →</button>`,code:'<h1>Code, coming into view.</h1><p>Your actual repository link will be connected here.</p>',demo:'<h1>A project in action.</h1><p>Your demonstration link will be connected here.</p>'};const layer=document.createElement('div');layer.className='modal';layer.innerHTML=`<section class="letter" role="dialog" aria-modal="true" aria-label="${modal}"><button class="dismiss cursor-interaction" data-go="close">Back to the bakery ×</button>${copy[modal]||copy.about}<div class="notice" aria-live="polite"></div></section>`;content.append(layer)}
function go(v,persist=true){if(v.startsWith('project:')){project=Number(v.split(':')[1]);scene='project';modal=null}else if(v.startsWith('role:')){role=v.split(':')[1];scene='experience';modal=null}else if(v==='close'){modal=null}else if(['outside','inside','experience'].includes(v)){scene=v;modal=null}else modal=v;render();if(modal)content.querySelector('.dismiss')?.focus({preventScroll:true});if(persist)window.openai?.setWidgetState?.({modelContent:{preferredBakeryScene:scene,preferredBakeryProject:project,preferredBakeryRole:role}})?.catch(()=>{})}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.note)content.querySelector('.notice').textContent=b.dataset.note});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){go('close');root.querySelector('.brand').focus({preventScroll:true})}if(e.key==='Tab'&&modal){const a=[...content.querySelector('.letter').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===a[0]){a.at(-1).focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){a[0].focus();e.preventDefault()}}});const apply=s=>{if(!s)return;scene=['outside','inside','experience','project'].includes(s.preferredBakeryScene)?s.preferredBakeryScene:'outside';project=Number.isInteger(s.preferredBakeryProject)&&s.preferredBakeryProject>=0&&s.preferredBakeryProject<4?s.preferredBakeryProject:0;role=['rippling','earlier','campus'].includes(s.preferredBakeryRole)?s.preferredBakeryRole:'rippling';render()};render();apply(window.openai?.widgetState?.modelContent);window.addEventListener('openai:set_globals',e=>apply(e.detail?.globals?.widgetState?.modelContent));})();
</script>
</div>
